<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>

    <h1>Questão 4</h1>

    <p>
        Escreva um programa que calcule o perímetro (circunferência) de um círculo a partir do valor do raio.
    </p>

    <form id="formDados">
        <label for="valorRaio">Valor do raio:</label>
        <input type="number" step="0.01" min="0" id="valorRaio">

        <button type="submit">Calcular circunferência</button>
    </form>

    <p id="resultado"></p>

</body>
